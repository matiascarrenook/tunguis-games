<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d14">
<title>Pokémon · Jugando</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0d0d14;
    color: #e9e9f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    background: #161623;
    border-bottom: 1px solid #26263a;
    flex: none;
    min-height: 46px;
  }
  header a {
    color: #9a9aac;
    text-decoration: none;
    font-size: .9rem;
    flex: none;
    -webkit-tap-highlight-color: transparent;
  }
  header a:active { color: #fff; }
  header .titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  header .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  header .logoWrap {
    background: #fff;
    border: 2px solid #e8382f;
    border-radius: 6px;
    height: 26px;
    padding: 2px 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    box-shadow: 0 2px 0 rgba(0,0,0,.4);
  }
  header .logoWrap .logo {
    height: 100%;
    max-width: 30vw;
    object-fit: contain;
  }
  .contenedor {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px;
    min-height: 0;
  }
  @media (max-width: 520px) {
    .contenedor { padding: 0; }
  }
  .ejs_controls { z-index: 10 !important; }
  #noJuego {
    margin: auto;
    text-align: center;
    color: #9a9aac;
    padding: 24px;
  }
  #noJuego a {
    display: inline-block;
    margin-top: 14px;
    color: #fff;
    background: #e0201f;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
  }
</style>
</head>
<body>
<header>
  <a href="index.html">← Juegos</a>
  <span class="logoWrap" id="logoWrap" hidden><img class="logo" id="logo" alt=""></span>
  <div class="titulo"><span class="dot" id="dot"></span><span id="titulo">Cargando…</span></div>
</header>
<div class="contenedor">
  <div id="game"></div>
  <div id="noJuego" hidden>
    <p>Esta llave no corresponde a ningún cartucho.</p>
    <a href="index.html">Acercá tu llavero</a>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const key = (params.get("key") || "").trim().toLowerCase();
  let game = null;

  for (const k of Object.keys(GAMES)) {
    if (GAMES[k].token === key) { game = GAMES[k]; break; }
  }

  if (!game) {
    document.getElementById("noJuego").hidden = false;
    document.getElementById("titulo").textContent = "Llave inválida";
    return;
  }

  document.getElementById("titulo").textContent = game.nombre;
  document.getElementById("dot").style.background = game.color;
  document.getElementById("logoWrap").hidden = false;
  document.getElementById("logo").src = "img/" + game.img;
  document.querySelector("meta[name=theme-color]").setAttribute("content", game.color);
  document.documentElement.style.setProperty("--color", game.color);

  window.EJS_player = "#game";
  window.EJS_core = "gba";
  window.EJS_gameUrl = "roms/" + encodeURIComponent(game.file);
  window.EJS_gameName = game.nombre;
  window.EJS_gameID = game.gameID;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_theme = "dark";
  window.EJS_fixedSaveInterval = 7000;
  window.EJS_defaultOptions = {
    "save-state-location": "browser",
    "save-state-slot": 1
  };

  const s = document.createElement("script");
  s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
  document.head.appendChild(s);
})();
</script>
</body>
</html>
