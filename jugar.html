<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d14">
<meta name="description" content="Emulador GBA Pokémon con soporte offline y llaveros.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pokémon · Jugando</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0d0d14;
    color: #e9e9f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    background: #161623;
    border-bottom: 1px solid #26263a;
    flex: none;
    min-height: 46px;
  }
  header a.back {
    color: #9a9aac;
    text-decoration: none;
    font-size: .9rem;
    flex: none;
    -webkit-tap-highlight-color: transparent;
  }
  header a.back:active { color: #fff; }
  header .titulo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1;
  }
  header .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  header .logoWrap {
    background: #fff;
    border: 2px solid #e8382f;
    border-radius: 6px;
    height: 26px;
    padding: 2px 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
    box-shadow: 0 2px 0 rgba(0,0,0,.4);
  }
  header .logoWrap .logo { height: 100%; max-width: 30vw; object-fit: contain; }
  #btnInstalar {
    flex: none;
    background: #e8382f;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: .85rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,.4);
    display: none;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  #btnInstalar:active { filter: brightness(1.2); }
  #btnInstalar.ok { background: #227a4b; }
  .aviso {
    margin: 8px auto -8px;
    max-width: 640px;
    width: calc(100% - 16px);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: .9rem;
    text-align: center;
    font-weight: 600;
    background: #143223;
    border: 1px solid #227a4b;
    color: #7df0b0;
  }
  .aviso.error { background: #3a1616; border-color: #a03030; color: #ff9d9d; }
  .contenedor {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px;
    min-height: 0;
  }
  @media (max-width: 520px) { .contenedor { padding: 0; } }
  .ejs_controls { z-index: 10 !important; }
  #noJuego {
    margin: auto;
    text-align: center;
    color: #9a9aac;
    padding: 24px;
  }
  #noJuego a {
    display: inline-block;
    margin-top: 14px;
    color: #fff;
    background: #e0201f;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
  }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← Juegos</a>
  <span class="logoWrap" id="logoWrap" hidden><img class="logo" id="logo" alt=""></span>
  <div class="titulo"><span class="dot" id="dot"></span><span id="titulo">Cargando…</span></div>
  <button id="btnInstalar">📲 App Tunguis Games</button>
</header>
<div class="aviso" id="aviso" hidden></div>
<div class="contenedor">
  <div id="game"></div>
  <div id="noJuego" hidden>
    <p>Esta llave no corresponde a ningún cartucho.</p>
    <a href="index.html">Acercá tu llavero</a>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const key = (params.get("key") || "").trim().toLowerCase();
  const pokemon = (params.get("pokemon") || "").trim().toLowerCase();
  let game = null;
  let gameKey = "";

  for (const k of Object.keys(GAMES)) {
    if (GAMES[k].token === key) { game = GAMES[k]; gameKey = k; break; }
  }

  if (!game) {
    document.getElementById("noJuego").hidden = false;
    document.getElementById("titulo").textContent = "Llave inválida";
    return;
  }

  const $ = (id) => document.getElementById(id);
  $("titulo").textContent = game.nombre;
  $("dot").style.background = game.color;
  $("logoWrap").hidden = false;
  $("logo").src = "img/" + game.img;
  document.querySelector("meta[name=theme-color]").setAttribute("content", game.color);
  document.documentElement.style.setProperty("--color", game.color);

  window.EJS_player = "#game";
  window.EJS_core = "gba";
  window.EJS_gameName = game.nombre;
  window.EJS_gameID = game.gameID;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_theme = "dark";
  window.EJS_fixedSaveInterval = 7000;
  window.EJS_cacheConfig = { enabled: false };
  window.EJS_defaultOptions = {
    "save-state-location": "browser",
    "save-state-slot": 1
  };
  window.EJS_onGameStart = function () {
    try { localStorage.setItem("tunguis_juego_" + game.gameID, game.nombre); } catch (e) {}
  };

  const aviso = $("aviso");

  function mostrarAviso(msg, error) {
    aviso.textContent = msg;
    aviso.classList.toggle("error", !!error);
    aviso.hidden = false;
  }

  function tokenABytes(token) {
    const b = new Uint8Array(token.length / 2);
    for (let i = 0; i < b.length; i++) b[i] = parseInt(token.substr(i * 2, 2), 16);
    return b;
  }

  function swListo() {
    if (!("serviceWorker" in navigator)) return Promise.resolve();
    return navigator.serviceWorker.ready
      .then(function () { return new Promise(function (r) { setTimeout(r, 300); }); })
      .catch(function () {});
  }

  async function descifrar() {
    const res = await fetch("roms/" + encodeURIComponent(game.file));
    if (!res.ok) throw new Error("No se pudo descargar la ROM cifrada");
    const buf = await res.arrayBuffer();
    const iv = new Uint8Array(buf.slice(0, 12));
    const data = new Uint8Array(buf.slice(12));
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(game.token));
    const key = await crypto.subtle.importKey("raw", digest, "AES-GCM", false, ["decrypt"]);
    const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    return new Uint8Array(claro);
  }

  function configurarCheats() {
    if (!pokemon || !window.POKEMON_CHEATS) return;
    const mapa = window.POKEMON_CHEATS[pokemon];
    if (!mapa) { mostrarAviso("Este Pokémon aún no tiene llavero configurado.", true); return; }
    const codigo = mapa[gameKey] || [];
    if (!codigo.length) { mostrarAviso("Códigos para " + pokemon.toUpperCase() + " pendientes de verificar.", true); return; }
    window.EJS_cheats = codigo;
    mostrarAviso("🎉 ¡" + pokemon.toUpperCase() + " obtenido en " + game.nombre + "!");
  }
  configurarCheats();

  (async function () {
    await swListo();
    try {
      const claro = await descifrar();
      const blob = new Blob([claro], { type: "application/octet-stream" });
      window.EJS_gameUrl = URL.createObjectURL(blob);

      const s = document.createElement("script");
      s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.head.appendChild(s);
    } catch (err) {
      mostrarAviso("No se pudo abrir el juego: " + err.message, true);
      $("titulo").textContent = "Error";
    }
  })();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
<script src="instalar.js"></script>
</body>
</html>
